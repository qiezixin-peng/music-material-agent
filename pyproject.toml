[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "music-material-agent"
version = "0.1.0"
description = "Durable, auditable music search and material collection infrastructure for agents."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=2.0,<3",
  "openpyxl>=3.1.5,<4",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
adapters = [
  "scrapling>=0.5.1,<0.6",
]
musicdl = [
  "musicdl==2.14.2",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
music-material = "music_material_agent.cli:main"
music-material-mcp = "music_material_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/music_material_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["music_material_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
